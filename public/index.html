<!DOCTYPE html>
<html lang="nl">
<head>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1A0088" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="'t Rijnsburgje" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Restaurant 't Rijnsburgje</title>
<link rel="stylesheet" href="/styles.css">
<style>
:root{
  /* Afgeleid van styles.css — geen losse kleuren */
  --bg:        var(--color-bg);
  --surface:   color-mix(in srgb, var(--color-bg) 40%, white);
  --surface2:  var(--color-bg);
  --border:    color-mix(in srgb, var(--color-dark) 14%, transparent);
  --border2:   color-mix(in srgb, var(--color-dark) 26%, transparent);
  --text:      var(--color-dark);
  --text2:     var(--color-text-muted);
  --text3:     color-mix(in srgb, var(--color-text-muted) 60%, transparent);
  --accent:    var(--color-primary);
  --accent2:   var(--color-primary);
  --accent-bg: color-mix(in srgb, var(--color-primary) 10%, white);
  --green:     var(--color-accent-text);
  --green-bg:  color-mix(in srgb, var(--color-accent) 22%, white);
  --blue:      var(--color-dark);
  --blue-bg:   color-mix(in srgb, var(--color-dark) 9%, white);
  --red:       var(--color-primary);
  --red-bg:    color-mix(in srgb, var(--color-primary) 10%, white);
  --gold:      var(--color-accent-text);
  --gold-bg:   color-mix(in srgb, var(--color-accent) 18%, white);
  --radius:10px;--radius-lg:16px;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}

/* ── Header ── */
#hdr{background:var(--color-dark);padding:16px 20px 0;padding-top:calc(16px + env(safe-area-inset-top));position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#hdr-inner{max-width:800px;margin:0 auto}
#hdr h1{font-size:21px;font-weight:700;color:var(--color-bg);letter-spacing:-.02em}
#hdr h1 span{font-weight:400;font-style:italic}
#hdr-sub{font-size:12px;color:var(--color-bg);margin:4px 0 14px;opacity:.65}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0;background:transparent}
#tabs::-webkit-scrollbar{display:none}
.tb{padding:10px 16px;background:transparent;color:var(--color-bg);opacity:.6;border:none;font-size:13px;font-weight:500;border-radius:8px 8px 0 0;transition:all .15s;white-space:nowrap;letter-spacing:.01em;position:relative}
.tb.on{background:var(--bg);color:var(--text);font-weight:600;opacity:1;box-shadow:inset 0 3px 0 var(--color-primary)}

/* ── Content ── */
#content{max-width:800px;margin:0 auto;padding:24px 16px 100px}

/* ── Recipe cards ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}

/* Feed-modus: één kolom, gecentreerd, groot beeld */
.feed-grid{grid-template-columns:1fr;max-width:520px;margin:0 auto;gap:28px}
.feed-grid .rcard-img{height:300px}
.feed-grid .rcard{box-shadow:var(--shadow-lg)}
.feed-grid .rcard:hover{transform:none;box-shadow:var(--shadow-lg)}

/* Zoekresultaten lijstweergave */
.search-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:box-shadow .15s}
.srow:hover{box-shadow:var(--shadow)}
.srow-thumb{width:60px;height:60px;border-radius:8px;flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.srow-thumb img{width:100%;height:100%;object-fit:cover}
.srow-body{flex:1;min-width:0}
.srow-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.srow-meta{font-size:11px;color:var(--text3);margin-top:2px}
.srow-acts{display:flex;gap:4px;flex-shrink:0;align-items:center}

.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;position:relative;cursor:pointer}
.rcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.rcard.sel{border:2px solid var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.14)}
.rcard-img{height:168px;background:linear-gradient(135deg,var(--surface2) 0%,var(--border2) 100%);display:flex;align-items:center;justify-content:center;position:relative}
.rcard-img-emoji{font-size:56px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
.sel-badge{position:absolute;top:12px;right:12px;background:var(--accent);color:var(--color-bg);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.meld-bdg{position:absolute;top:-5px;right:-5px;background:#FF6500;color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px;box-sizing:border-box;line-height:1;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.meld-bdg.toon{display:flex}
.meld-nieuw{background:var(--accent-bg) !important;border-color:var(--accent) !important}
.tijd-sticker{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);color:var(--color-bg);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.3px;pointer-events:none}
.week-nav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.rcard-body{padding:18px 18px 14px}
.rcard-labels{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.lbl{border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;letter-spacing:.03em;display:inline-flex;align-items:center;gap:3px}
.lbl-k{background:var(--gold-bg);color:var(--gold);border:1px solid var(--border)}
.lbl-c{background:var(--blue-bg);color:var(--blue);border:1px solid var(--border)}
.lbl-n{background:var(--red-bg);color:var(--red);border:1px solid var(--border)}
.lbl-t{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.rcard-title{font-size:18px;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:6px}
.rcard-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:12px}
.rcard-note{background:var(--gold-bg);border-left:3px solid var(--gold);padding:6px 10px;font-size:12px;color:var(--gold);margin-bottom:12px;border-radius:0 6px 6px 0;font-style:italic}
.rcard-meta{display:flex;justify-content:space-between;align-items:center}
.stars{display:flex;gap:2px}
.star{font-size:16px;color:var(--border2);cursor:pointer;transition:color .1s;line-height:1}
.star.on{color:var(--accent)}
.rcard-pers{font-size:12px;color:var(--text3)}
.rcard-divider{height:1px;background:var(--border);margin:0 18px}
.rcard-expand{padding:10px 18px;font-size:12px;color:var(--text2);font-weight:500;display:flex;justify-content:space-between;cursor:pointer;user-select:none;letter-spacing:.02em;min-height:40px;align-items:center}
.rcard-expand:hover{background:var(--surface2)}
.rcard-detail{padding:14px 18px;background:var(--bg);display:none;border-top:1px solid var(--border)}
.rcard-detail.open{display:block}
.rcard-detail h4{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px}
.rcard-detail ul,.rcard-detail ol{padding:0 0 0 18px;margin:0 0 14px}
.rcard-detail li{font-size:13px;color:var(--text);margin-bottom:5px;line-height:1.55}
.rcard-actions{padding:10px 14px 14px;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;border-top:1px solid var(--border);-webkit-overflow-scrolling:touch}
.rcard-actions .btn{padding:7px 10px;font-size:13px;white-space:nowrap;flex-shrink:0}
.rcard-week-picker{padding:10px 14px 14px;border-top:1px solid var(--border);background:var(--bg)}
.wp-opt{width:100%;text-align:left;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:5px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit;font-size:13px}
.wp-opt:hover{background:var(--surface2);border-color:var(--accent)}
.wp-opt.wp-actief{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.wp-wn{font-weight:700}
.wp-bereik{font-size:11px;color:var(--text3)}
.wp-opt.wp-actief .wp-bereik{color:var(--accent)}
.wp-cancel{background:none;border:none;padding:5px 0 0;font-size:12px;color:var(--text3);cursor:pointer;width:100%;text-align:center;font-family:inherit}

/* ── Calendar picker ── */
.rcard-cal{padding:10px 14px 14px;border-top:1px solid var(--border);background:var(--bg)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-titel{font-size:13px;font-weight:700;color:var(--text)}
.cal-nav{background:none;border:none;font-size:18px;color:var(--text2);cursor:pointer;padding:2px 8px;border-radius:6px;line-height:1}
.cal-nav:hover{background:var(--surface2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.cal-dag-hdr{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:4px 0}
.cal-dag{background:none;border:none;border-radius:6px;padding:6px 2px;font-size:13px;color:var(--text);cursor:pointer;text-align:center;min-height:32px;font-family:inherit}
.cal-dag:hover{background:var(--surface2)}
.cal-dag.vandaag{background:var(--blue-bg);color:var(--blue);font-weight:700}
.cal-dag.gekozen{background:var(--accent);color:var(--color-bg);font-weight:700}
.cal-dag.leeg{pointer-events:none;visibility:hidden}
/* ── Datumkiezer modal ── */
#dpk,#rpk,#kook-modal,#vriend-recept-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:flex-end;justify-content:center}
#dpk.open,#rpk.open,#kook-modal.open,#vriend-recept-modal.open{display:flex}
.dpk-box{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:460px;box-shadow:var(--shadow-lg);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.dpk-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.dpk-head-titel{font-size:16px;font-weight:700;color:var(--text)}
.dpk-sluit{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:0;line-height:1}
.dpk-scroll{flex:1;overflow-y:auto;padding:14px 16px}
.dpk-foot{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
.dpk-gekozen{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;min-height:22px}
.datum-pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.datum-pill button{background:none;border:none;cursor:pointer;color:var(--accent);font-size:12px;padding:0;line-height:1}
/* ── Dag-rijen weekmenu ── */
.dag-rij{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.dag-rij-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.dag-rij-naam{font-size:13px;font-weight:700;color:var(--text)}
.dag-rij-datum{font-size:11px;color:var(--text3)}
.dag-rij-body{padding:8px 12px}
.dag-recept-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.dag-recept-item:last-child{border-bottom:none}
.dag-recept-naam{flex:1;font-size:13px;color:var(--text);font-weight:500}
.dag-recept-meta{font-size:11px;color:var(--text3)}
.dag-recept-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px 6px;border-radius:4px}
.dag-recept-del:hover{background:var(--red-bg);color:var(--red)}
.dag-add{display:flex;align-items:center;gap:6px;padding:7px 0;color:var(--text3);font-size:13px;cursor:pointer;background:none;border:none;font-family:inherit;width:100%;text-align:left}
.dag-add:hover{color:var(--accent)}

/* ── Buttons ── */
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;transition:all .15s;cursor:pointer;letter-spacing:.01em;display:inline-flex;align-items:center;gap:5px;justify-content:center;min-height:40px}
.btn-dark{background:var(--color-dark);color:var(--color-bg)}
.btn-dark:hover{opacity:.85}
.btn-accent{background:var(--color-primary);color:var(--color-bg)}
.btn-accent:hover{opacity:.88}
.btn-saved{background:var(--green-bg);color:var(--green)}
.btn-light{background:var(--surface2);color:var(--text2)}
.btn-light:hover{background:var(--border)}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2)}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid var(--border)}
.btn-w{width:100%;padding:14px 0;font-size:14px;border-radius:var(--radius);min-height:48px}
.btn-w2{width:100%;padding:13px 0;font-size:14px;border-radius:var(--radius);margin-top:8px;min-height:48px}

/* ── Inputs ── */
.inp{padding:12px 14px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:15px;color:var(--text);outline:none;background:var(--surface);width:100%;transition:border .15s}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical}

/* ── Filter bar ── */
.filter-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow)}
.filter-wrap h3{font-size:13px;color:var(--text);margin-bottom:10px;font-weight:700}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fb{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s;min-height:34px}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.on{background:var(--accent);color:var(--color-bg);border-color:var(--accent)}
.fb.nnek{background:var(--red-bg);color:var(--red);border-color:var(--border)}
.fb.nnek.on{background:var(--red);color:var(--color-bg)}

/* ── Search box ── */
.search-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 18px;margin-bottom:20px;box-shadow:var(--shadow)}
.search-wrap h2{font-size:20px;margin-bottom:16px;color:var(--text)}
.mode-row{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);border-radius:var(--radius);padding:4px}
.mb{flex:1;padding:9px 0;border-radius:7px;background:transparent;color:var(--text2);border:none;font-size:13px;font-weight:500;transition:all .15s;min-height:40px}
.mb.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.search-hint{font-size:12px;color:var(--text3);margin-top:6px;font-style:italic}

/* ── Week menu stepper ── */
.stepper{display:inline-flex;align-items:center;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.stepper button{background:transparent;border:none;font-size:16px;color:var(--accent);width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:background .15s}
.stepper button:hover{background:var(--border)}
.stepper span{font-size:14px;color:var(--text);min-width:30px;text-align:center;font-weight:600}

/* ── Shopping list ── */
.afd-header{display:flex;align-items:center;gap:8px;margin:20px 0 8px}
.afd-title{font-weight:700;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em}
.afd-line{flex:1;height:1px;background:var(--border)}
.afd-count{font-size:11px;color:var(--text3)}
.sitem{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:5px;transition:all .15s;background:var(--surface);min-height:48px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sitem:hover{border-color:var(--border2)}
.sitem.done{opacity:.5}
.sitem.checking{opacity:.65}
.sitem.checking .sname{text-decoration:line-through;color:var(--text3);transition:all .3s}
.scb{width:22px;height:22px;border-radius:6px;flex-shrink:0;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;font-size:12px;color:var(--color-bg)}
.scb.done,.scb.checking{border-color:var(--accent);background:var(--accent)}
.sname{flex:1;font-size:14px;color:var(--text);cursor:pointer;line-height:1.35}
.sname.done{text-decoration:line-through;color:var(--text3)}
.sqty{font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap}
.sdel{background:transparent;border:none;color:var(--border2);font-size:14px;padding:4px 6px;cursor:pointer;transition:color .15s;flex-shrink:0}
.sdel:hover{color:var(--red)}
.sdrag{font-size:14px;color:var(--border2);cursor:grab;flex-shrink:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:0 6px;touch-action:none}
.afd-sel{border:1px solid var(--border);background:var(--surface2);font-size:13px;cursor:pointer;padding:2px 4px;border-radius:6px;flex-shrink:0;max-width:150px;color:var(--text)}
.afd-group.drag-over{outline:2px dashed var(--accent);outline-offset:4px;border-radius:var(--radius)}
.sitem.dragging{opacity:.5;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:scale(1.02);z-index:10;position:relative}
.done-section{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:20px}
.done-section h3{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;gap:6px;cursor:pointer}
.done-items{display:flex;flex-direction:column;gap:4px}
.foto-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s;background:var(--surface)}
.foto-zone:hover{border-color:var(--accent)}
.foto-zone input{display:none}
.foto-preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);display:block}
.crop-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:var(--radius);cursor:crosshair;position:relative;background:#000}
.crop-img{width:100%;height:100%;object-fit:cover;pointer-events:none}
mark.onleesbaar{background:#fff3cd;color:#856404;border-radius:3px;padding:1px 4px;font-size:12px;font-weight:600}
.onleesbaar-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#856404}

/* ── Misc ── */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.box-info{background:var(--accent-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--text);line-height:1.5}
.box-err{background:var(--red-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--red);line-height:1.5}
.empty{text-align:center;padding:64px 20px;color:var(--text3);font-size:15px;line-height:1.6}
.empty span{font-size:44px;display:block;margin-bottom:14px}
.hint{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;font-style:italic;line-height:1.6}

/* ── Onboarding ── */
#ob-ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.ob-kaart{background:var(--surface);border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,.3)}
.ob-illu{height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.ob-emoji{font-size:64px;line-height:1}
@keyframes ob-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ob-slide-fwd{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ob-slide-back{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ob-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ob-fwd{animation:ob-slide-fwd .28s cubic-bezier(.4,0,.2,1)}
.ob-back{animation:ob-slide-back .28s cubic-bezier(.4,0,.2,1)}
.ob-body{padding:28px 24px 24px}
.ob-stap-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.ob-titel{font-size:23px;font-weight:700;color:var(--text);margin-bottom:12px;line-height:1.25}
.ob-tekst{font-size:15px;color:var(--text2);line-height:1.65;margin-bottom:22px}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:all .2s}
.ob-dot.on{background:var(--accent);width:20px;border-radius:4px}
.ob-nav{display:flex;gap:10px}
.ob-mini-ui{background:var(--surface2);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text2);margin-top:10px;border:1px solid var(--border)}
@keyframes spin{to{transform:rotate(360deg)}}
.laad-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:56px 20px;color:var(--text3);font-size:14px}
.laad-cirkel{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
.sec-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px}

/* ── Vrienden ── */
.friend-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;box-shadow:var(--shadow);min-height:56px}
.friend-name{flex:1;font-size:14px;font-weight:500;color:var(--text)}
.friend-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-bg);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--accent);flex-shrink:0}
.rcard-auteur{position:absolute;top:8px;left:8px;font-size:11px;font-weight:500;color:#1A0088;background:rgba(255,255,255,0.75);backdrop-filter:blur(4px);padding:2px 8px;border-radius:999px;pointer-events:none;z-index:1}
.rcard-stars-overlay{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,0.75);backdrop-filter:blur(4px);padding:2px 8px;border-radius:999px;display:flex;gap:2px;z-index:1}
.btn-like{background:transparent;border:none;cursor:pointer;font-size:14px;color:var(--text2);padding:6px 10px;border-radius:20px;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-like:hover{background:var(--red-bg);color:var(--red)}
.btn-like.liked{color:var(--red)}
.prog-bar{display:flex;gap:6px;margin-bottom:16px}
.prog-seg{flex:1;height:3px;border-radius:3px;background:var(--border);transition:background .3s}
.prog-seg.done{background:var(--accent)}
.divider{height:1px;background:var(--border);margin:16px 0}

/* Modal */
#mov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
#mov.open{display:flex}
#mbox{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:800px;box-shadow:var(--shadow-lg);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
#mbox-scroll{flex:1;overflow-y:auto;padding:24px 20px 8px}
#mbox-footer{flex-shrink:0;padding:12px 20px;background:var(--surface);border-top:1px solid var(--border)}
.cat-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;font-weight:500;margin:0 5px 7px 0;cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.ak{background:var(--gold-bg);color:var(--gold);border-color:var(--border)}
.cat-btn.ac{background:var(--blue-bg);color:var(--blue);border-color:var(--border)}

@media(max-width:540px){
  .cards-grid{grid-template-columns:1fr}
  #hdr h1{font-size:18px}
  .tb{padding:9px 12px;font-size:12px}
  .rcard-img{height:200px}
}

    ingredienten:row.ingredients||[],stappen:row.instructions||[],

    rating:row.rating||0,notities:row.notes||'',

    opgeslagen:true,datum:row.created_at?row.created_at.split('T')[0]:'',

async function savRecept(r){

// ── Weekmenu Supabase ─────────────────────────────────────────────────────────
function localeDateStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getMaandag(){
  const d=new Date();
  const day=d.getDay(); // 0=zo,1=ma,...,6=za
  const diff=day===0?1:1-day; // zondag→volgende maandag; anders→huidige maandag
  return localeDateStr(new Date(d.getFullYear(),d.getMonth(),d.getDate()+diff));
}
function getVolgendeWeek(){
  const d=new Date(getMaandag()+'T00:00:00');
  d.setDate(d.getDate()+7);
  return localeDateStr(d);
}
function getVorigeWeek(){
  const d=new Date(getMaandag()+'T00:00:00');
  d.setDate(d.getDate()-7);
  return localeDateStr(d);
}
function formatMaandag(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});
}
function weekNummer(startStr){
  const p=startStr.split('-');
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}
function weekLabel(startStr){
  return`Week ${weekNummer(startStr)}`;
}
function formatWeekBereik(maandag){
  const d=new Date(maandag+'T00:00:00');
  const z=new Date(d);z.setDate(d.getDate()+6);
  const fmtDag=dt=>dt.toLocaleDateString('nl-NL',{weekday:'long'});
  const fmtDatum=dt=>dt.toLocaleDateString('nl-NL',{day:'numeric',month:'long'});
  return`${fmtDag(d)} ${fmtDatum(d)} – ${fmtDag(z)} ${fmtDatum(z)} ${z.getFullYear()}`;
}
function verschuifWeek(delta){
  const d=new Date((S.actieveWeek||getMaandag())+'T00:00:00');

async function laadWeekmenu(){
  if(!S.gebruiker)return;
  const{data:menu}=await DB.from('week_menus').select('id,is_public').eq('user_id',S.gebruiker.id).eq('week_start',S.actieveWeek).maybeSingle();
  if(!menu){S.menuId=null;S.weekMenuPubliek=false;S.geselecteerd=[];S.weekPers={};}
  else{
    S.menuId=menu.id;S.weekMenuPubliek=menu.is_public||false;
    const{data:items}=await DB.from('week_menu_items').select('recipe_id,servings,day_of_week').eq('menu_id',menu.id).order('day_of_week');
    S.weekPers={};
    const geselSet=new Set();
    (items||[]).forEach(i=>{
      if(i.servings)S.weekPers[i.recipe_id]=i.servings;
      if(i.day_of_week!=null){
        const d=new Date(S.actieveWeek+'T00:00:00');d.setDate(d.getDate()+(i.day_of_week+6)%7);
        const ds=localeDateStr(d);
        if(!S.receptDagen[i.recipe_id])S.receptDagen[i.recipe_id]=[];
        if(!S.receptDagen[i.recipe_id].includes(ds))S.receptDagen[i.recipe_id].push(ds);
        geselSet.add(i.recipe_id);
      }
    });
    S.geselecteerd=[...geselSet];
  }
  await laadAlleWeekMenus();
}
async function laadAlleWeekMenus(){
  if(!S.gebruiker)return;
  const basis=new Date(getMaandag()+'T00:00:00');
  const weken=[];
  for(let i=0;i<5;i++){const d=new Date(basis);d.setDate(d.getDate()+i*7);weken.push(localeDateStr(d));}
  const{data:menus}=await DB.from('week_menus').select('id,week_start').eq('user_id',S.gebruiker.id).in('week_start',weken);
  if(!menus||!menus.length){S.receptWeek={};return;}
  const weekMap={};menus.forEach(m=>weekMap[m.id]=m.week_start);
  const menuIds=menus.map(m=>m.id);
  const{data:items}=await DB.from('week_menu_items').select('menu_id,recipe_id,day_of_week').in('menu_id',menuIds);
  S.receptWeek={};S.receptDagen={};
  (items||[]).forEach(i=>{
    const ws=weekMap[i.menu_id];S.receptWeek[i.recipe_id]=ws;
    if(i.day_of_week!=null){
      const d=new Date(ws+'T00:00:00');d.setDate(d.getDate()+(i.day_of_week+6)%7);
      const ds=localeDateStr(d);
      if(!S.receptDagen[i.recipe_id])S.receptDagen[i.recipe_id]=[];
      if(!S.receptDagen[i.recipe_id].includes(ds))S.receptDagen[i.recipe_id].push(ds);
    }
  });
}

function formatDagKort(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dag=d.toLocaleDateString('nl-NL',{weekday:'short'}).replace('.','');
  const datum=d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
  return`${dag} ${datum}`;
}
function dagWeekStart(dateStr){
  const p=dateStr.split('-');
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  const diff=(d.getDay()+6)%7; // dagen sinds maandag (ma=0,...,zo=6)
  const mon=new Date(+p[0],+p[1]-1,+p[2]-diff);
  return`${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
}

function getDatesForRecipe(recipeId){return S.receptDagen[recipeId]||[];}
function getRecipesForWeek(weekStartStr){
  const result={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  Object.entries(S.receptDagen).forEach(([rid,dates])=>{
    dates.forEach(ds=>{
      if(dagWeekStart(ds)===weekStartStr){
        const r=S.recepten.find(x=>x.id===rid)||S.menuReceptenMap[rid];
        if(r)result[new Date(ds+'T00:00:00').getDay()].push({...r,geplandeDatum:ds});
      }
    });
  });
  return result;
}
async function linkRecipeToDate(recipeId,dateStr){
  const arr=getDatesForRecipe(recipeId);
  if(arr.includes(dateStr))return;
  S.receptDagen[recipeId]=[...arr,dateStr].sort();
  const ws=dagWeekStart(dateStr);
  S.receptWeek[recipeId]=S.receptWeek[recipeId]||ws;
  if(ws===S.actieveWeek&&!S.geselecteerd.includes(recipeId))S.geselecteerd.push(recipeId);
  // Boodschappenlijst meteen bijwerken
  if(ws===S.actieveWeek){bouwShop();if(S.gebruiker&&S.menuId)slaBoodschappenlijstOp();}
  rIP();renderDpkGekozen();
  if(!S.gebruiker)return;
  const mid=await ensureMenuVoorWeek(ws);
  if(!mid)return;
  if(ws===S.actieveWeek)S.menuId=mid;
  const sv=S.weekPers[recipeId]||S.recepten.find(r=>r.id===recipeId)?.personen||4;
  const dow=new Date(dateStr+'T00:00:00').getDay();
  await DB.from('week_menu_items').delete().eq('menu_id',mid).eq('recipe_id',recipeId).eq('day_of_week',dow);
  await DB.from('week_menu_items').insert({menu_id:mid,recipe_id:recipeId,day_of_week:dow,servings:sv});
  // Sla boodschappenlijst op met correct menuId
  if(ws===S.actieveWeek)slaBoodschappenlijstOp();
}
async function unlinkRecipeFromDate(recipeId,dateStr){
  const nieuw=(S.receptDagen[recipeId]||[]).filter(d=>d!==dateStr);
  if(!nieuw.length)delete S.receptDagen[recipeId];else S.receptDagen[recipeId]=nieuw;
  const ws=dagWeekStart(dateStr);
  const nogInWeek=(S.receptDagen[recipeId]||[]).some(d=>dagWeekStart(d)===ws);
  if(!nogInWeek){
    if(ws===S.actieveWeek)S.geselecteerd=S.geselecteerd.filter(x=>x!==recipeId);
    if(!(S.receptDagen[recipeId]||[]).length)delete S.receptWeek[recipeId];
  }
  // Boodschappenlijst altijd meteen bijwerken voor de actieve week
  if(ws===S.actieveWeek){bouwShop();if(S.gebruiker&&S.menuId)slaBoodschappenlijstOp();}
  rIP();renderDpkGekozen();
  if(!S.gebruiker)return;
  const{data:menu}=await DB.from('week_menus').select('id').eq('user_id',S.gebruiker.id).eq('week_start',ws).maybeSingle();
  if(!menu)return;
  const dow=new Date(dateStr+'T00:00:00').getDay();
  await DB.from('week_menu_items').delete().eq('menu_id',menu.id).eq('recipe_id',recipeId).eq('day_of_week',dow);
}

function renderDpkCal(){
  if(!S.calPicker){return;}
  const{id,jaar,maand}=S.calPicker;
  const mnamen=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];

async function assignToWeek(id,weekStart){
  const prev=S.receptWeek[id];
  S.weekPickerFor=null;
  if(prev===weekStart){
    delete S.receptWeek[id];delete S.receptDagen[id];rIP();
    if(prev===S.actieveWeek){S.geselecteerd=S.geselecteerd.filter(x=>x!==id);slaWeekmenuOp();}
    else{const mid=await ensureMenuVoorWeek(prev);if(mid)await DB.from('week_menu_items').delete().eq('menu_id',mid).eq('recipe_id',id);}
    return;
  }
  if(prev){
    if(prev===S.actieveWeek){S.geselecteerd=S.geselecteerd.filter(x=>x!==id);}
    else{const mid=await ensureMenuVoorWeek(prev);if(mid)await DB.from('week_menu_items').delete().eq('menu_id',mid).eq('recipe_id',id);}
  }
  S.receptWeek[id]=weekStart;rIP();
  if(weekStart===S.actieveWeek){
    if(!S.geselecteerd.includes(id))S.geselecteerd.push(id);
    slaWeekmenuOp();
  } else {
    const mid=await ensureMenuVoorWeek(weekStart);
    if(mid){const sv=S.weekPers[id]||S.recepten.find(r=>r.id===id)?.personen||4;await DB.from('week_menu_items').upsert({menu_id:mid,recipe_id:id,servings:sv,day_of_week:0},{onConflict:'menu_id,recipe_id'});}
    if(prev===S.actieveWeek)slaWeekmenuOp();
  }
}

async function slaWeekmenuOp(){
  if(!S.gebruiker)return;

  if(!menuId){
    const{data:bestaand}=await DB.from('week_menus').select('id').eq('user_id',S.gebruiker.id).eq('week_start',S.actieveWeek).maybeSingle();
    if(bestaand){menuId=bestaand.id;}
    else{
      const{data:nieuw,error}=await DB.from('week_menus').insert({user_id:S.gebruiker.id,week_start:S.actieveWeek,is_public:S.weekMenuPubliek}).select('id').single();
      if(error){console.error('Weekmenu aanmaken mislukt:',error.message);return;}
      menuId=nieuw.id;
    }
    S.menuId=menuId;
  }
  await DB.from('week_menu_items').delete().eq('menu_id',menuId);
  const rijen=[];
  Object.entries(S.receptDagen).forEach(([rid,dates])=>{
    if(rid.startsWith('demo-'))return;
    dates.forEach(ds=>{
      if(dagWeekStart(ds)===S.actieveWeek){
        rijen.push({menu_id:menuId,recipe_id:rid,day_of_week:new Date(ds+'T00:00:00').getDay(),servings:S.weekPers[rid]||null});
      }
    });
  });
  if(rijen.length>0){
    const{error}=await DB.from('week_menu_items').insert(rijen);
    if(error)console.error('Weekmenu opslaan mislukt:',error.message);
  }
}

async function laadFeedMenus(){
  if(!S.gebruiker||!S.ikVolg.length){S.feedMenus=[];S.vriendenWekenMap={};return;}
  const volgIds=S.ikVolg.map(p=>p.id);
  const dezeWeek=getMaandag(),vorigeWeek=getVorigeWeek(),volgendeWeek=getVolgendeWeek();
  const{data:alleMenus}=await DB.from('week_menus').select('id,user_id,week_start')
    .in('user_id',volgIds).eq('is_public',true).in('week_start',[vorigeWeek,dezeWeek,volgendeWeek]);
  S.vriendenWekenMap={};
  (alleMenus||[]).forEach(m=>{
    if(!S.vriendenWekenMap[m.user_id])S.vriendenWekenMap[m.user_id]=[];
    if(m.week_start===vorigeWeek)S.vriendenWekenMap[m.user_id].push('vorige week');
    if(m.week_start===dezeWeek)S.vriendenWekenMap[m.user_id].push('deze week');
    if(m.week_start===volgendeWeek)S.vriendenWekenMap[m.user_id].push('volgende week');
  });
  const menus=(alleMenus||[]).filter(m=>m.week_start===dezeWeek);
  if(!menus.length){S.feedMenus=[];rIP();return;}
  const profielMap={};S.ikVolg.forEach(p=>profielMap[p.id]=p.display_name);
  const resultaten=await Promise.all(menus.map(async menu=>{
    const{data:items}=await DB.from('week_menu_items')
      .select('recipe_id,recipes(id,title,description,image_url,ingredients,instructions,cuisine,category,tags,servings,source_url,is_public,user_id)')
      .eq('menu_id',menu.id).order('day_of_week');
    const recepten=(items||[]).filter(i=>i.recipes).map(i=>fromSB(i.recipes));
    recepten.forEach(r=>{S.menuReceptenMap[r.id]=r;});
    return{menuId:menu.id,userId:menu.user_id,naam:profielMap[menu.user_id]||'',recepten};
  }));

  rIP();
}

  }

    console.error('Verwijderen mislukt:',error.message);
    if(backup){S.recepten=[backup,...S.recepten.filter(r=>r.id!==id)];}
    S.fout='Verwijderen mislukt: '+error.message;

    console.warn('Verwijderen geblokkeerd door Supabase RLS — DELETE policy ontbreekt waarschijnlijk. Recipe id:',id);

    S.fout='Recept kon niet worden verwijderd. Controleer de Supabase DELETE-policy voor de recipes tabel.';
    render();
  }
}

function dataUrlNaarBlob(dataUrl){
  const[header,data]=dataUrl.split(',');
  const mime=header.match(/:(.*?);/)[1];
  const bstr=atob(data);let n=bstr.length;

  while(n--)arr[n]=bstr.charCodeAt(n);
  return new Blob([arr],{type:mime});
}

// ── API — robust JSON extraction ──────────────────────────────────────────────
function extractJSON(txt){
  // Try to find JSON array, handle markdown fences and extra text
  let clean=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  // Find outermost array
  let depth=0,start=-1,end=-1;
  for(let i=0;i<clean.length;i++){
    if(clean[i]==='['){if(start===-1)start=i;depth++;}
    else if(clean[i]===']'){depth--;if(depth===0){end=i;break;}}
  }
  if(start===-1||end===-1)throw new Error('Geen JSON array gevonden in antwoord');
  const slice=clean.slice(start,end+1);
  try{return JSON.parse(slice);}
  catch(e){
    // Try to fix common issues: unescaped quotes, trailing commas
    const fixed=slice.replace(/,\s*([}\]])/g,'$1').replace(/(['"])?([a-zA-Z0-9_]+)(['"])?:/g,'"$2":');
    return JSON.parse(fixed);
  }
}

async function callAPI(messages,search=false,maxTokens=1200,sysOverride=null){
  const sys=(sysOverride||SYS).replace('DATUM',new Date().toISOString().split('T')[0]);
  const body={model:"claude-sonnet-4-20250514",max_tokens:maxTokens,system:sys,messages};
  if(search)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const resp=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok){
    try{const e=await resp.json();throw new Error(e?.error?.message||'API fout: '+resp.status);}
    catch(e2){if(e2.message!==('API fout: '+resp.status)&&!e2.message.startsWith('JSON'))throw e2;throw new Error('API fout: '+resp.status);}
  }
  const data=await resp.json();
  if(data.error)throw new Error(data.error.message||'API fout');
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(!txt)throw new Error('Geen antwoord ontvangen');
  return extractJSON(txt);
}

function normaliseer(parsed,fallbackBron){
  return parsed.map(r=>({...r,
    id:r.id||'r'+Date.now()+Math.random().toString(36).slice(2),
    tags:r.tags||[],keuken:r.keuken||'',categorie:parseCats(r.categorie),
    afbeelding:r.afbeelding||'',bron:r.bron||fallbackBron||'',
    tijdBereiding:parseInt(r.tijdBereiding)||0,
    tijdWacht:parseInt(r.tijdWacht)||0,
  }));
}
function fmtMin(m){
  if(!m||m<=0)return'';
  if(m<60)return m+'min';
  const u=Math.floor(m/60),rest=m%60;
  return rest?`${u}u${rest}`:`${u}u`;
}
function tijdSticker(r){
  const b=parseInt(r.tijdBereiding)||0;
  const w=parseInt(r.tijdWacht)||0;
  if(!b&&!w)return'';
  if(b&&w)return`⏱ ${fmtMin(b)}+${fmtMin(w)}`;
  return`⏱ ${fmtMin(b||w)}`;
}


async function zoekUrl(){
  const q=document.getElementById('inp-url')?.value?.trim();if(!q)return;
  S.zoekUrl=q;S.laden=true;S.fout='';S.urlFoutGeblokkeerd=false;S.resultaten=[];render();
  try{
    const pr=await fetch('/fetch?url='+encodeURIComponent(q));
    if(!pr.ok){const e=await pr.json().catch(()=>({}));throw new Error(e?.error||'Kon pagina niet ophalen');}
    const pd=await pr.json();

    // JSON-LD gevonden? Gebruik die direct — veel betrouwbaarder dan tekst
    if(pd.schema_recept){
      const sr=pd.schema_recept;
      const datum=new Date().toISOString().split('T')[0];
      const recept={
        id:'r'+Date.now()+Math.random().toString(36).slice(2),
        titel:sr.titel||'Recept',
        omschrijving:sr.omschrijving||'',
        personen:sr.personen||4,
        ingredienten:sr.ingredienten||[],
        stappen:sr.stappen||[],
        keuken:sr.keuken||'',
        categorie:'',tags:[],notities:'',
        bron:q,
        afbeelding:sr.afbeelding||pd.image||'',
        tijdBereiding:sr.tijdBereiding||0,
        tijdWacht:sr.tijdWacht||0,
        rating:0,opgeslagen:false,datum,
      };
      S.resultaten=[recept];
      return;
    }

    // Geen JSON-LD: stuur tekst naar Claude
    if(!pd.text||pd.text.length<100)throw new Error('Pagina bevat te weinig tekst');
    const parsed=await callAPI([{role:'user',content:`Haal het recept uit deze tekst. Bron URL: ${q}\n\n${pd.text.slice(0,8000)}`}],false,2000,SYS_URL);
    if(pd.image&&parsed[0])parsed[0].afbeelding=pd.image;
    if(!Array.isArray(parsed)||!parsed.length)throw new Error('Geen recept gevonden');
    S.resultaten=normaliseer(parsed,q);
  }catch(e){
    S.fout=e.message;
    S.urlFoutGeblokkeerd=e.message.includes('blokkeert')||e.message.includes('verbinding')||e.message.includes('inloggen')||e.message.includes('betaal');
  }
  finally{S.laden=false;render();}
}

async function verwerkTekst(){
  const tekst=S.handmatigeTekst.trim();

}

function bouwShop(){
  const sel=S.recepten.filter(r=>S.geselecteerd.includes(r.id));
  const map={};
  sel.forEach(r=>{
    const p=gP(r.id);
    (r.ingredienten||[]).forEach(ing=>{
      const k=ing.naam.toLowerCase().trim();
      const hv=parseFloat((ing.hoeveelheid*(p/(r.personen||4))).toFixed(1));
      const uk=map[k]&&map[k].eenheid!==ing.eenheid?k+'_'+ing.eenheid:k;
      if(map[uk]&&map[uk].eenheid===ing.eenheid)map[uk].hoeveelheid=parseFloat((map[uk].hoeveelheid+hv).toFixed(1));
      else map[uk]={naam:ing.naam,hoeveelheid:hv,eenheid:ing.eenheid,done:false,afd:getAfd(ing.naam),extra:false};
    });
  });
  const items=Object.values(map);
  items.forEach(ni=>{const o=S.shopItems.find(x=>x.naam.toLowerCase()===ni.naam.toLowerCase()&&x.eenheid===ni.eenheid&&!x.extra);if(o)ni.done=o.done;});
  // Voeg vaste boodschappen toe die nog niet in extraItems zitten
  const extraNamen=new Set(S.extraItems.map(e=>e.naam.toLowerCase()));
  S.vasteBoodschappen.forEach(vb=>{
    if(!extraNamen.has(vb.naam.toLowerCase())){
      S.extraItems.push({...vb,extra:true,vast:true,done:false});
    }
  });
  S.shopItems=[...items,...S.extraItems.map(e=>({...e,afd:e.afd||getAfd(e.naam)}))];
}
async function verbeterBoodschappen(){
  const recepItems=S.shopItems.filter(i=>!i.extra);
  if(!recepItems.length)return;
  try{
    const input=recepItems.map(i=>({hoeveelheid:i.hoeveelheid,eenheid:i.eenheid||'',naam:i.naam}));
    const result=await callAPI([{role:'user',content:`Reformuleer deze ingrediënten voor een boodschappenlijst:\n${JSON.stringify(input)}`}],false,800,SYS_SHOP);
    if(Array.isArray(result)&&result.length===recepItems.length){
      recepItems.forEach((item,i)=>{
        if(typeof result[i]==='string'&&result[i].trim())item.naam=result[i].trim();
      });
    }
  }catch(e){console.warn('Reformuleren mislukt, gebruik ruwe hoeveelheden:',e.message);}
}

async function herlaadBoodschappen(lijstId){
  const{data}=await DB.from('shopping_items').select('*').eq('list_id',lijstId).order('sort_order');
  if(!data)return;
  S.shopItems=data.map(i=>{
    const m=(i.amount||'').match(/^([\d.]+)\s*(.*)$/);
    const item={naam:i.name,hoeveelheid:m?parseFloat(m[1]):1,eenheid:m?(m[2]||'').trim():'',done:i.is_checked,extra:i.sort_order>=1000,afd:i.department||'Overig',sbId:i.id};
    if(S.vasteBoodschappen.some(vb=>vb.naam.toLowerCase()===i.name.toLowerCase()))item.vast=true;
    return item;
  });
  S.extraItems=S.shopItems.filter(i=>i.extra);
  // Injecteer vaste boodschappen die ontbreken (bijv. na terugkeer naar een oude week)
  const bestaand=new Set(S.shopItems.map(i=>i.naam.toLowerCase()));
  const toVoegen=S.vasteBoodschappen.filter(vb=>!bestaand.has(vb.naam.toLowerCase()));
  if(toVoegen.length){
    const rijen=toVoegen.map((vb,i)=>({
      list_id:lijstId,name:vb.naam,
      amount:`${vb.hoeveelheid}${vb.eenheid?' '+vb.eenheid:''}`,
      department:vb.afd||getAfd(vb.naam),is_checked:false,
      sort_order:1000+S.extraItems.length+i,
    }));
    const{data:inserted}=await DB.from('shopping_items').insert(rijen).select('id');
    toVoegen.forEach((vb,i)=>{
      const item={...vb,extra:true,vast:true,done:false,sbId:inserted?.[i]?.id};
      S.extraItems.push(item);S.shopItems.push(item);
    });
  }
  rIP();
}

function abonneer(lijstId){
  if(realtimeSub){DB.removeChannel(realtimeSub);realtimeSub=null;}

    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'shopping_items',filter:`list_id=eq.${lijstId}`},
      payload=>{const item=S.shopItems.find(i=>i.sbId===payload.new.id);if(item){item.done=payload.new.is_checked;rIP();}}
    ).subscribe();

const _shopTimers=new Map();
function toggleShop(idx){
  const item=S.shopItems[idx];if(!item)return;
  if(item.done){
    // Al afgevinkt → direct terugzetten
    item.done=false;item.checking=false;
    if(_shopTimers.has(item)){clearTimeout(_shopTimers.get(item));_shopTimers.delete(item);}
    if(item.sbId)DB.from('shopping_items').update({is_checked:false}).eq('id',item.sbId).then(({error})=>{if(error)console.error(error.message);});
    rIP();
  }else if(item.checking){
    // Klik tijdens wachttijd → annuleren
    item.checking=false;
    if(_shopTimers.has(item)){clearTimeout(_shopTimers.get(item));_shopTimers.delete(item);}
    rIP();
  }else{
    // Afvinken: toon doorstreept, wacht 2s, verplaats dan naar afgevinkt
    item.checking=true;rIP();
    _shopTimers.set(item,setTimeout(()=>{
      item.done=true;item.checking=false;_shopTimers.delete(item);
      if(item.sbId)DB.from('shopping_items').update({is_checked:true}).eq('id',item.sbId).then(({error})=>{if(error)console.error(error.message);});
      rIP();
    },1000));
  }
}
function delShop(idx){
  const item=S.shopItems[idx];
  if(item?.sbId)DB.from('shopping_items').delete().eq('id',item.sbId).then(({error})=>{if(error)console.error(error.message);});
  S.shopItems.splice(idx,1);
  if(item?.extra)S.extraItems=S.extraItems.filter(e=>e!==item);
  if(item?.vast)verwijderUitVast(item.naam);
  else rIP();
}

async function fileNaarDataUrl(file,maxPx=1600){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.85));
    };img.src=url;
  });
}
async function fotoBestandGekozen(type){
  const id=type==='recept'?'foto-recept-inp':'foto-eten-inp';
  const file=document.getElementById(id)?.files?.[0];if(!file)return;
  const dataUrl=await fileNaarDataUrl(file,type==='recept'?1600:1200);
  if(type==='recept'){S.fotoReceptPreview=dataUrl;S.fotoResultaatIdx=null;S.fotoFout='';S.resultaten=[];}
  else{S.fotoEtenPreview=dataUrl;S.fotoCropX=50;S.fotoCropY=50;}
  rIP();
}
function fotoTapCrop(e){
  const r=e.currentTarget.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  S.fotoCropX=Math.round((cx-r.left)/r.width*100);
  S.fotoCropY=Math.round((cy-r.top)/r.height*100);
  const img=document.getElementById('crop-img');
  if(img)img.style.objectPosition=`${S.fotoCropX}% ${S.fotoCropY}%`;
  // Don't call rIP() to avoid re-render during touch
}
function fotoTapCropEnd(){rIP();}
function telOnleesbaar(r){
  if(!r)return 0;let n=0;
  const chk=v=>{if(typeof v==='string'&&v.includes('[ONLEESBAAR'))n++;};
  chk(r.titel);chk(r.omschrijving);chk(r.notities);
  (r.ingredienten||[]).forEach(i=>{chk(i.naam);chk(String(i.hoeveelheid));chk(i.eenheid);});
  (r.stappen||[]).forEach(chk);return n;
}
async function analyseerReceptFoto(){
  if(!S.fotoReceptPreview){S.fotoFout='Upload eerst een receptfoto.';rIP();return;}
  S.fotoLaden=true;S.fotoFout='';S.resultaten=[];S.fotoOnleesbaar=0;rIP();
  try{
    const b64=S.fotoReceptPreview.split(',')[1];
    const mt=S.fotoReceptPreview.match(/data:([^;]+)/)?.[1]||'image/jpeg';
    const bronTekst=S.fotoBron?`\nBron/kookboek: ${S.fotoBron}`:'';
    const msg=[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:mt,data:b64}},
      {type:'text',text:`Extraheer het recept van deze foto.${bronTekst} Gebruik [ONLEESBAAR: omschrijving] voor onleesbare tekst.`}
    ]}];
    const parsed=await callAPI(msg,false,3000,SYS_FOTO);
    if(!Array.isArray(parsed)||!parsed.length)throw new Error('Geen recept herkend in de afbeelding.');
    const r={...parsed[0]};
    if(S.fotoBron)r.bron=S.fotoBron;
    if(S.fotoEtenPreview){r.afbeelding=S.fotoEtenPreview;r.afbeeldingPositie=`${S.fotoCropX}% ${S.fotoCropY}%`;}
    r.id='foto-'+Date.now();r.opgeslagen=false;r.datum=new Date().toISOString().split('T')[0];
    S.fotoOnleesbaar=telOnleesbaar(r);
    S.resultaten=[r];
  }catch(e){S.fotoFout=e.message;}
  S.fotoLaden=false;rIP();
}

function openVriendReceptModal(receptId){
  const weken=S.vriendenProfiel?.weken||{};
  const r=[...(weken.vorige||[]),...(weken.deze||[]),...(weken.volgende||[])].find(x=>x.id===receptId);
  if(!r)return;
  S.vriendenReceptModal=r;

  const body=document.getElementById('vrm-body');
  body.innerHTML=`

  btn.disabled=al;

  btn.style.cssText='flex:2;min-height:44px'+(al?';opacity:1':'');
  btn.onclick=al?null:()=>voegVriendReceptToe();
  document.getElementById('vriend-recept-modal').classList.add('open');
}
function sluitVriendReceptModal(){
  document.getElementById('vriend-recept-modal').classList.remove('open');
  S.vriendenReceptModal=null;
}
async function voegVriendReceptToe(){
  const r=S.vriendenReceptModal;if(!r||!S.gebruiker)return;
  if(S.toegevoegdeIds.has(r.id))return;
  const nieuwId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36);
  const kopie={...r,id:nieuwId,publiek:true,eigenaarId:S.gebruiker.id,opgeslagen:true,datum:new Date().toISOString().split('T')[0]};
  S.recepten.unshift(kopie);
  S.toegevoegdeIds.add(r.id);
  try{localStorage.setItem(SK+'-toegevoegd',JSON.stringify([...S.toegevoegdeIds]));}catch{}
  sluitVriendReceptModal();
  render();
  await savRecept(kopie);
  if(r.eigenaarId&&r.eigenaarId!==S.gebruiker.id){
    const{error:me}=await DB.from('notifications').insert({user_id:r.eigenaarId,actor_id:S.gebruiker.id,actor_name:S.profiel?.display_name||'',type:'copy',recipe_id:r.id,recipe_title:r.titel});
    if(me)console.error('Voeg toe melding fout:',me.message,me);
  }
  alert(`"${r.titel}" is toegevoegd aan jouw recepten.`);
}
function kookSP(delta){
  if(!S.kookModal)return;

}

  const stps=(r.stappen||[]).map(s=>`<li style="margin-bottom:8px">${h(s)}</li>`).join('');

let dragShopIdx=null;
function startDragShop(idx){dragShopIdx=idx;}
function dragOverAfd(el){el.classList.add('drag-over');}
function dragLeaveAfd(el){el.classList.remove('drag-over');}
function dropOnAfd(el,afd){el.classList.remove('drag-over');if(dragShopIdx===null)return;moveShopAfd(dragShopIdx,afd);dragShopIdx=null;}

// Touch drag — via event delegation met passive:false (zie DOMContentLoaded)
let tDragIdx=null,tDragTimer=null,tDragActive=false,tOverAfd=null,tDragEl=null;
function _tDragCleanup(drop){
  clearTimeout(tDragTimer);tDragTimer=null;
  if(tDragEl)tDragEl.classList.remove('dragging');
  document.querySelectorAll('.afd-group.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(drop&&tDragActive&&tOverAfd!==null&&tDragIdx!==null)moveShopAfd(tDragIdx,tOverAfd);
  tDragActive=false;tDragIdx=null;tOverAfd=null;tDragEl=null;
}

function moveShopAfd(idx,afd){
  if(!S.shopItems[idx])return;
  S.shopItems[idx].afd=afd;
  const ei=S.extraItems.indexOf(S.shopItems[idx]);if(ei!==-1)S.extraItems[ei].afd=afd;
  rIP();
}
function renderBoodschappen(){
  if(S.shopItems.length===0&&(S.geselecteerd.length>0||S.vasteBoodschappen.length>0))bouwShop();

  else if(S.vasteBoodschappen.length>0){
    const aanwezig=new Set(S.shopItems.map(i=>i.naam.toLowerCase()));
    const toVoegen=S.vasteBoodschappen.filter(vb=>!aanwezig.has(vb.naam.toLowerCase()));
    if(toVoegen.length){
      toVoegen.forEach(vb=>{
        const item={...vb,extra:true,vast:true,done:false};
        S.extraItems.push(item);S.shopItems.push(item);

            <button class="sdel" onclick="delShop(${item.idx})">✕</button>
          </div>`).join('')}
      </div>`).join('')}

    <!-- Afgevinkte items onderaan -->
    ${done.length>0?`
      <div class="done-section">
        <h3 onclick="S.toonAfgevinkt=!S.toonAfgevinkt;rIP()">

          <span style="margin-left:auto;font-size:10px;font-weight:400">${S.toonAfgevinkt?'Verberg':'Toon'}</span>

            <button class="sdel" onclick="delShop(${idx})">✕</button>
          </div>`;}).join('')}</div>`:''}
      </div>`:''}
`;
}

async function openVriendProfiel(id){
  S.vriendenProfiel={id,display_name:'',bio:'',volgend:[],weken:{vorige:[],deze:[],volgende:[]},laden:true};
  rIP();
  const dezeWeek=getMaandag(),vorigeWeek=getVorigeWeek(),volgendeWeek=getVolgendeWeek();
  const[{data:prof},{data:volgend},{data:wkMenus}]=await Promise.all([
    DB.from('profiles').select('id,display_name,bio').eq('id',id).single(),
    DB.from('follows').select('following_id').eq('follower_id',id),
    DB.from('week_menus').select('id,week_start').eq('user_id',id).eq('is_public',true).in('week_start',[vorigeWeek,dezeWeek,volgendeWeek]),
  ]);
  const volgIds=(volgend||[]).map(r=>r.following_id);
  const wkMenuIds=(wkMenus||[]).map(m=>m.id);
  const[{data:volgProf},{data:wkItems}]=await Promise.all([
    volgIds.length>0?DB.from('profiles').select('id,display_name').in('id',volgIds):Promise.resolve({data:[]}),
    wkMenuIds.length>0?DB.from('week_menu_items').select('menu_id,recipes(id,title,description,image_url,cuisine,category,tags,servings,source_url,ingredients,instructions,is_public,user_id)').in('menu_id',wkMenuIds):Promise.resolve({data:[]}),
  ]);
  const weekMap={};(wkMenus||[]).forEach(m=>weekMap[m.id]=m.week_start);
  const weken={vorige:[],deze:[],volgende:[]};
  (wkItems||[]).forEach(i=>{
    if(!i.recipes)return;
    const ws=weekMap[i.menu_id];const r=fromSB(i.recipes);
    if(ws===vorigeWeek&&!weken.vorige.find(x=>x.id===r.id))weken.vorige.push(r);
    if(ws===dezeWeek&&!weken.deze.find(x=>x.id===r.id))weken.deze.push(r);
    if(ws===volgendeWeek&&!weken.volgende.find(x=>x.id===r.id))weken.volgende.push(r);
  });
  S.vriendenProfiel={id,display_name:prof?.display_name||'',bio:prof?.bio||'',volgend:volgProf||[],weken,laden:false};
  rIP();
}

async function wijzigWachtwoord(){
  const ww1=document.getElementById('p-ww1')?.value||'';
  const ww2=document.getElementById('p-ww2')?.value||'';
  const foutEl=document.getElementById('p-fout');
  const toonFout=t=>{foutEl.textContent=t;foutEl.style.display='';};

function toggleWW(btn){
  const inp=btn.closest('div').querySelector('input');
  if(!inp)return;
  const toon=inp.type==='password';
  inp.type=toon?'text':'password';
  const svg=btn.querySelector('svg');
  if(toon){
    svg.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    svg.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

async function registreer(){
  const naam=document.getElementById('reg-naam')?.value?.trim();
  const email=document.getElementById('reg-email')?.value?.trim();
  const ww=document.getElementById('reg-ww')?.value;
  if(!naam){S.authFout='Vul je naam in';rIP();return;}
  if(!email){S.authFout='Vul je e-mailadres in';rIP();return;}
  if(!ww||ww.length<6){S.authFout='Wachtwoord moet minimaal 6 tekens zijn';rIP();return;}
  S.authLaden=true;S.authFout='';rIP();
  try{
    const{data,error}=await DB.auth.signUp({email,password:ww});
    if(error)throw error;
    const username=naam.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').slice(0,20)+'-'+Date.now().toString(36);
    const{error:pe}=await DB.from('profiles').insert({id:data.user.id,username,display_name:naam});
    if(pe)throw pe;
    S.gebruiker=data.user;S.profiel={display_name:naam};
    await lod();S.scherm='app';render();
    await verwerkPendingVolg();
    startOnboarding();
  }catch(e){S.authFout=e.message||'Er ging iets mis';}
  finally{S.authLaden=false;render();}
}

async function login(){
  const email=document.getElementById('log-email')?.value?.trim();
  const ww=document.getElementById('log-ww')?.value;
  if(!email||!ww){S.authFout='Vul e-mail en wachtwoord in';rIP();return;}
  S.authLaden=true;S.authFout='';rIP();
  try{
    const{data,error}=await DB.auth.signInWithPassword({email,password:ww});
    if(error)throw error;
    S.gebruiker=data.user;
    const{data:p}=await DB.from('profiles').select('display_name,bio').eq('id',data.user.id).single();
    S.profiel=p||{display_name:email};
    await lod();S.scherm='app';render();
    await verwerkPendingVolg();
  }catch(e){S.authFout=e.message==='Invalid login credentials'?'E-mail of wachtwoord klopt niet':e.message||'Er ging iets mis';}
  finally{S.authLaden=false;render();}
}

function stapOnboarding(delta){
  const nieuw=S.onboardingStap+delta;
  if(nieuw<0||nieuw>=OB_STAPPEN.length)return;
  S.onboardingRichting=delta>0?'fwd':'back';
  S.onboardingStap=nieuw;
  renderOnboardingOverlay();
}

function sluitOnboarding(naarOntdekken=false){
  document.getElementById('ob-ovl')?.remove();
  S.onboarding=false;
  if(naarOntdekken){S.tab='zoeken';render();}
}

function renderOnboardingOverlay(){
  const stap=OB_STAPPEN[S.onboardingStap];
  const totaal=OB_STAPPEN.length;
  const isLaatste=S.onboardingStap===totaal-1;
  const isEerste=S.onboardingStap===0;
  const richting=S.onboardingRichting;

  const dots=OB_STAPPEN.map((_,i)=>`<div class="ob-dot${i===S.onboardingStap?' on':''}"></div>`).join('');

  const html=`
    <div id="ob-ovl" onclick="if(event.target===this)sluitOnboarding()">
      <div class="ob-kaart">
        <div class="ob-illu" style="background:${stap.kleur}">
          <div class="${richting==='fwd'?'ob-fwd':'ob-back'}" style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%">
            ${stap.illu}
          </div>
        </div>
        <div class="ob-body">
          <div class="${richting==='fwd'?'ob-fwd':'ob-back'}">
            ${stap.tab?`<div class="ob-stap-label">Tab: ${stap.tab}</div>`:`<div class="ob-stap-label">Stap ${S.onboardingStap+1} van ${totaal}</div>`}
            <div class="ob-titel">${stap.titel}</div>
            <div class="ob-tekst">${stap.tekst}</div>
          </div>
          <div class="ob-dots">${dots}</div>
          <div class="ob-nav">
            ${!isEerste?`<button class="btn btn-ghost" onclick="stapOnboarding(-1)" style="flex:1">← Vorige</button>`:`<button class="btn btn-ghost" onclick="sluitOnboarding()" style="flex:1">Overslaan</button>`}
            ${isLaatste
              ?`<button class="btn btn-accent" onclick="sluitOnboarding(true)" style="flex:2">Ga naar Ontdekken →</button>`
              :`<button class="btn btn-accent" onclick="stapOnboarding(1)" style="flex:2">${isEerste?'Rondleiding starten →':'Volgende →'}</button>`}

function startOnboarding(){

async function importeerLink(url){
  S.zoekUrl=url;S.laden=true;S.fout='';S.resultaten=[];S.ontdekTab='url';render();
  try{
    const pr=await fetch('/fetch?url='+encodeURIComponent(url));
    if(!pr.ok){const e=await pr.json().catch(()=>({}));throw new Error(e?.error||'Kon pagina niet ophalen');}
    const pd=await pr.json();
    if(pd.schema_recept){
      const sr=pd.schema_recept;
      const datum=new Date().toISOString().split('T')[0];
      S.resultaten=[{
        id:'r'+Date.now()+Math.random().toString(36).slice(2),
        titel:sr.titel||'Recept',omschrijving:sr.omschrijving||'',
        personen:sr.personen||4,ingredienten:sr.ingredienten||[],stappen:sr.stappen||[],
        keuken:sr.keuken||'',categorie:'',tags:[],notities:'',bron:url,
        afbeelding:sr.afbeelding||pd.image||'',rating:0,opgeslagen:false,datum,
      }];
      return;
    }
    if(!pd.text||pd.text.length<100)throw new Error('Pagina bevat te weinig tekst');
    const parsed=await callAPI([{role:'user',content:`Haal het recept uit deze tekst. Bron URL: ${url}\n\n${pd.text.slice(0,8000)}`}],false,2000,SYS_URL);
    if(pd.image&&parsed[0])parsed[0].afbeelding=pd.image;
    if(!Array.isArray(parsed)||!parsed.length)throw new Error('Geen recept gevonden');
    S.resultaten=normaliseer(parsed,url);
  }catch(e){S.fout=e.message;}
  finally{S.laden=false;render();}
}
function rIP(){

  render();

  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,se);}catch(e){}}}
}
window.addEventListener('DOMContentLoaded',async()=>{
  // Touch drag — passive:false zodat preventDefault() werkt (tekst-selectie blokkeren)
  document.addEventListener('touchstart',e=>{
    const sitem=e.target.closest('.sitem');
    if(!sitem)return;
    // Niet activeren op knoppen, checkbox, select — die moeten normaal tikken
    if(e.target.closest('.scb,.sdel,.afd-sel,button,select,input'))return;
    const idx=parseInt(sitem.dataset.idx);
    tDragEl=sitem;
    tDragTimer=setTimeout(()=>{
      tDragActive=true;tDragIdx=idx;
      tDragEl?.classList.add('dragging');
      navigator.vibrate&&navigator.vibrate(30);
    },400);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(tDragTimer&&!tDragActive){clearTimeout(tDragTimer);tDragTimer=null;return;}
    if(!tDragActive)return;
    e.preventDefault();
    const t=e.touches[0];
    document.querySelectorAll('.afd-group.drag-over').forEach(el=>el.classList.remove('drag-over'));
    const under=document.elementFromPoint(t.clientX,t.clientY);
    const grp=under?.closest('.afd-group');
    if(grp){grp.classList.add('drag-over');tOverAfd=grp.dataset.afd;}else{tOverAfd=null;}
  },{passive:false});
  document.addEventListener('touchend',e=>{
    const wasDrag=tDragActive;
    _tDragCleanup(true);
    if(wasDrag)e.preventDefault(); // voorkom click-event na drag
  },{passive:false});
  document.addEventListener('touchcancel',()=>_tDragCleanup(false));

  const params=new URLSearchParams(window.location.search);
  if(params.get('volg'))pendingVolgId=params.get('volg');
  try{const t=localStorage.getItem(SK+'-tab');if(t&&['recepten','weekmenu','boodschappen','vrienden','profiel'].includes(t))S.tab=t;}catch(e){}
  render();
  const{data:{session}}=await DB.auth.getSession();
  if(session){
    S.gebruiker=session.user;
    const{data:p}=await DB.from('profiles').select('display_name').eq('id',session.user.id).single();
    S.profiel=p||{display_name:session.user.email};
    await lod();S.scherm='app';
    await verwerkPendingVolg();
  }else{
    S.scherm='login';
    if(params.get('uitnodigen')||params.get('volg'))S.authTab='register';
  }
  render();
});

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('✅ PWA actief:', reg.scope))
        .catch(err => console.log('❌ SW fout:', err));
    });
  }

  // Pull to refresh
  let _ptrY=0,_ptrActief=false,_ptrGereed=false;
  const PTR_DREMPEL=80;
  const _ptrEl=()=>document.getElementById('ptr');
  const _ptrIcoon=()=>document.getElementById('ptr-icoon');
  const _ptrTekst=()=>document.getElementById('ptr-tekst');
  const _scrollTop=()=>Math.max(window.scrollY,document.documentElement.scrollTop,document.body.scrollTop);
  document.addEventListener('touchstart',e=>{
    if(_scrollTop()<=1){
      _ptrY=e.touches[0].clientY;
      _ptrActief=true;_ptrGereed=false;
    }
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!_ptrActief)return;
    if(_scrollTop()>1){_ptrActief=false;_ptrEl().style.opacity=0;return;}
    const dy=e.touches[0].clientY-_ptrY;
    if(dy<=0)return;
    e.preventDefault();
    const progress=Math.min(dy/PTR_DREMPEL,1);
    const el=_ptrEl();
    el.style.opacity=Math.min(progress*1.8,1);
    el.style.transform=`translateY(${Math.min(dy*0.35,44)}px)`;
    _ptrGereed=dy>=PTR_DREMPEL;
    _ptrIcoon().style.transform=_ptrGereed?'rotate(180deg)':'rotate(0deg)';
    _ptrTekst().textContent=_ptrGereed?'Loslaten om te verversen':'Trek naar beneden';
  },{passive:false});
  document.addEventListener('touchend',async()=>{
    if(!_ptrActief)return;
    _ptrActief=false;
    const el=_ptrEl();
    if(!_ptrGereed){el.style.opacity=0;el.style.transform='';return;}
    _ptrIcoon().style.transform='';
    _ptrTekst().textContent='Verversen...';
    _ptrIcoon().style.animation='ptr-spin 0.7s linear infinite';
    try{
      if(typeof loadRecepten==='function')await loadRecepten();
      if(typeof laadWeekmenu==='function')await laadWeekmenu();
      if(typeof laadBoodschappen==='function')await laadBoodschappen();
      if(typeof laadVrienden==='function')await laadVrienden();
      if(typeof laadPubliekeRecepten==='function')await laadPubliekeRecepten();
      if(typeof laadMeldingenDB==='function')await laadMeldingenDB();
      if(typeof render==='function')render();
    }finally{
      _ptrIcoon().style.animation='';
      el.style.opacity=0;el.style.transform='';
    }
  });
</script>
<style>
  @keyframes ptr-spin{to{transform:rotate(360deg)}}
</style>
